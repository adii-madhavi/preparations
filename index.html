/* Layout: stacked rounded panels on a black ground, alternating dark and white, each with its own "logo · label · 03 / 10" header row.
   Deliberately one visual world (black / white / orange) in both host themes. */
:root{
  color-scheme:dark;
  --ground:#080808;
  --d-bg:#131313; --d-raise:#1c1c1c; --d-fg:#f3f3f1; --d-muted:#9b9b97; --d-line:#2a2a2a;
  --l-bg:#ffffff; --l-raise:#f4f4f2; --l-fg:#111111; --l-muted:#6c6c68; --l-line:#e6e6e3;
  --orange:#ff4f12; --orange-ink:#ffffff;
  --ok:#2fb36d; --warn:#f2a516; --bad:#ff5a4f;
  --display:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mark:"Oswald","Arial Narrow",ui-sans-serif,sans-serif;
  --r:28px;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--d-fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.035em;font-weight:600}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}

/* panel shells */
.panel{border-radius:var(--r);padding:clamp(20px,3.6vw,48px);padding-top:0;display:grid;gap:clamp(24px,3.4vw,44px)}
.dark{--fg:var(--d-fg);--muted:var(--d-muted);--line:var(--d-line);--raise:var(--d-raise);--bgc:var(--d-bg);background:var(--d-bg);color:var(--d-fg)}
.light{--fg:var(--l-fg);--muted:var(--l-muted);--line:var(--l-line);--raise:var(--l-raise);--bgc:var(--l-bg);background:var(--l-bg);color:var(--l-fg)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:22px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.bar .mark{font-family:var(--mark);font-weight:600;font-size:1.35rem;letter-spacing:.02em;color:var(--fg);line-height:1}
.bar .mark sup{font-size:.5em;margin-left:1px;vertical-align:top;position:relative;top:-2px}
.bar .idx{justify-self:end;font-variant-numeric:tabular-nums}

.lead h1{font-size:clamp(2.4rem,6.2vw,4.6rem);line-height:.98}
.lead h2{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1}
.lead p{margin:0;color:var(--muted);font-size:1rem;max-width:46ch}
.eyebrow{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:1px}
.num{font-variant-numeric:tabular-nums}

  background:radial-gradient(120% 90% at 85% 0%,#3a3a3a 0%,transparent 55%),radial-gradient(60% 120% at 20% 110%,#2a2a2a 0%,transparent 60%),linear-gradient(160deg,#1b1b1b,#0d0d0d)}

.feature>*{position:relative;z-index:1}

.side{display:grid;gap:16px;grid-template-rows:auto 1fr}
.today{border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px;background:var(--raise)}
.today ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.today li{display:flex;gap:10px;align-items:baseline;font-size:.95rem}
.today li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--muted);transform:translateY(-2px)}
.today li.x{color:var(--orange);font-weight:600}.today li.x::before{background:var(--orange)}
.cta{display:grid;align-content:space-between;gap:24px;border-radius:20px;padding:20px;background:var(--orange);color:var(--orange-ink);text-decoration:none;min-height:150px;transition:transform .25s}

.cta .arr{justify-self:end;width:46px;height:46px;transition:transform .25s}
.cta:hover .arr{transform:translate(4px,-4px)}
.cta b{font-family:var(--display);font-size:1.5rem;letter-spacing:-.03em;line-height:1.05;font-weight:600;text-transform:uppercase}
.trust{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}

/* overview cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.card{display:grid;gap:12px;text-decoration:none;color:inherit}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--l-line);background:linear-gradient(180deg,#0b0b0b 0%,#1d1d1d 55%,#f1f1ef 55.2%);padding:16px;display:grid;align-content:space-between;color:#f3f3f1;transition:transform .25s,box-shadow .25s}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.45)}
.thumb .d{font-family:var(--display);font-size:2.6rem;font-weight:600;letter-spacing:-.05em;line-height:.9}
.thumb .d span{font-size:.38em;letter-spacing:0;color:#a9a9a5;margin-left:6px;font-weight:500}
.thumb .k{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#a9a9a5}
.thumb .pg{display:flex;gap:10px;align-items:center;color:#111;font-size:.78rem;font-weight:600}
.meter{flex:1;height:4px;border-radius:9px;background:#dcdcd8;overflow:hidden}
.meter i{display:block;height:100%;background:var(--orange);transition:width .35s}
.card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:500}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.o{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}

/* subject panels */
.facts{display:grid;gap:18px}
.facts .cd{font-family:var(--display);font-weight:600;letter-spacing:-.05em;font-size:clamp(3.4rem,8vw,5.4rem);line-height:.85}
.facts .cd small{font-size:.24em;letter-spacing:0;color:var(--muted);margin-left:8px;font-weight:500}
.facts dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:.92rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.prog{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.prog .meter{background:var(--line)}
.howto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px 20px;background:var(--raise)}

.howto p{margin:0;font-size:.92rem;color:var(--fg)}
.chs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:720px){.chs{justify-content:flex-start}}

.mods{display:grid;gap:14px}
.mod{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:18px 20px;cursor:pointer;list-style:none}
.mh::-webkit-details-marker{display:none}
.mh h3{font-size:clamp(1.1rem,2vw,1.35rem)}
.mh .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mh .chev{width:14px;height:14px;transition:transform .2s;color:var(--muted)}
details[open]>.mh .chev{transform:rotate(180deg)}
details[open]>.mh{border-bottom:1px solid var(--line)}
@media (max-width:620px){.mh{grid-template-columns:minmax(0,1fr)}.mh .r{justify-content:flex-start}}
.topics{list-style:none;margin:0;padding:0}
.tp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.tp:first-child{border-top:0}
.tp input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.tp input::after{content:"";width:10px;height:6px;border-left:2px solid var(--orange-ink);border-bottom:2px solid var(--orange-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tp input:checked{background:var(--orange);border-color:var(--orange)}
.tp input:checked::after{opacity:1}
.tp label{font-weight:500;cursor:pointer}
.tp.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--orange)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.v{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:.8rem;font-weight:500;transition:border-color .15s,background .15s}
.v:hover{border-color:var(--fg)}
.v.first{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.v.first:hover{filter:brightness(1.08)}
.v svg{width:10px;height:10px;flex:none}
.tip{margin-top:8px;font-size:.84rem;color:var(--muted)}
.tip b{color:var(--orange);font-weight:600}

/* plan */
.plan{list-style:none;margin:0;padding:0;display:grid}
.plan li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan li.past{color:var(--muted)}
.plan li.now{background:var(--raise);margin-inline:-16px;padding-inline:16px;border-radius:12px;border-top-color:transparent}
.plan li.now+li{border-top-color:transparent}
.plan .dd{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.plan .ex{color:var(--orange);font-weight:600}
@media (max-width:520px){.plan li{grid-template-columns:minmax(0,1fr);gap:4px}}
.foot{color:var(--d-muted);font-size:.8rem;text-align:center;padding-top:8px}

/* taskbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--ground) 70%,transparent)}
.nav .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(28,28,28,.92);border:1px solid var(--d-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px -12px rgba(0,0,0,.7)}
.nav .home{flex:none;font-family:var(--mark);font-weight:600;font-size:1.05rem;letter-spacing:.02em;color:var(--d-fg);text-decoration:none;padding:6px 14px 6px 12px;border-right:1px solid var(--d-line)}
.nav .links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}

.nav a.ln{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;color:var(--d-muted);text-decoration:none;font-size:.84rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:grid;gap:4px;padding:18px 22px;border-radius:20px;background:var(--d-bg);border:1px solid var(--d-line);color:var(--d-fg);text-decoration:none;transition:border-color .15s}
.pager a:hover{border-color:var(--orange)}
.pager a span{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--d-muted)}
.pager a b{font-family:var(--display);font-size:1.25rem;font-weight:600;letter-spacing:-.03em}
.pager .nx{text-align:right;grid-column:2}
.pager .nx.solo{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.pager .nx.solo span{color:var(--orange-ink);opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("semv-done",{});

const todayKey=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
const ymd=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
const fmt=(d,o)=>new Date(d).toLocaleDateString("en-IN",Object.assign({weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kolkata"},o||{}));
const dayDiff=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/864e5);
const yt=(ch,q)=>"https://www.youtube.com/results?search_query="+encodeURIComponent(CH[ch]+" "+q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PLAY='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1v8l7-4z" fill="currentColor"/></svg>';
const ARROW='<svg class="arr" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 36 36 12M16 12h20v20"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 5 4 4 4-4"/></svg>';

const sDate=s=>s.practical?s.slot.date+"T"+s.slot.start+":00"+IST:s.date;
const tm=s=>s.practical?s.slot.time:"2:00–4:00 pm";
const at=s=>s.practical?s.slot.at:"2 pm";
const ids=s=>s.modules.flatMap((m,mi)=>m.topics.map((_,ti)=>`${s.id}-${mi}-${ti}`));
const pct=s=>{const a=ids(s);return Math.round(a.filter(i=>done[i]).length/a.length*100)};
function cd(date){
  if(!date) return {n:"—",u:"date not set",lab:"Date TBA",cls:""};
  const d=dayDiff(ymd(date),todayKey());
  if(d<0) return {n:"✓",u:"done",lab:"Done",cls:"ok"};
  if(d===0) return {n:"0",u:"today",lab:"Today",cls:"bad"};
  if(d===1) return {n:"1",u:"day left",lab:"Tomorrow",cls:"bad"};
  return {n:String(d),u:"days left",lab:`In ${d} days`,cls:d<=4?"warn":""};
}
function due(s,m){return m.due||null}
function dueSt(d,complete){
  if(complete) return {cls:"ok",txt:"Done"};
  if(!d) return {cls:"",txt:"No deadline"};
  const x=dayDiff(d,todayKey());
  if(x<0) return {cls:"bad",txt:"Overdue"};
  if(x===0) return {cls:"warn",txt:"Finish today"};
  return {cls:"",txt:"Finish by "+fmt(d+"T12:00:00"+IST,{weekday:undefined})};
}

const ORDERED=()=>[...SUBJECTS].sort((a,b)=>(sDate(a)?Date.parse(sDate(a)):9e15)-(sDate(b)?Date.parse(sDate(b)):9e15));
const TOTAL=SUBJECTS.length+3;
const bar=(i,label)=>`<header class="bar"><span class="mark">SEM·V<sup>°</sup></span><span class="lab">${esc(label)}</span><span class="idx num">${String(i).padStart(2,"0")} / ${String(TOTAL).padStart(2,"0")}</span></header>`;

function hero(){
  const k=todayKey();
  const next=ORDERED().find(s=>sDate(s)&&dayDiff(ymd(sDate(s)),k)>=0);
  const c=next?cd(sDate(next)):null;
  const row=PLAN.find(p=>p[0]===k);
  const items=row?row[1].map(([t,ex])=>`<li class="${ex?"x":""}">${esc(t)}</li>`).join(""):`<li>Nothing planned for today. Pick a practical below.</li>`;
  const firstTarget=next?next.id:"ml";
  return `<section class="panel dark" id="top">${bar(1,"T.Y.B.Tech Computer · Winter 2026")}
    <div class="lead"><h1>Seven papers.<br>One plan, no noise.</h1>
      <p>Your Semester V board: two theory exams, one Honours paper and four practicals. Every syllabus topic has its videos and a finish-by date, and the countdowns update every day.</p></div>

      <div class="feature">

        ${next?`<div><div class="big num">${c.n}<small>${esc(c.u)}</small></div>
          <h3 style="margin-top:14px">${esc(next.name)}</h3>
          <div class="eyebrow" style="margin-top:6px">${esc(fmt(sDate(next)))} · ${esc(tm(next))}${next.practical?" · Lab "+esc(next.slot.lab):""}</div></div>`
          :`<h3>All exams are done. Well played.</h3>`}
        <div class="trust"><span>Report 20 min early</span><span>No phones in the hall</span><span>Changes posted on the college site</span></div>
      </div>
      <div class="side">
        <div class="today"><div class="eyebrow">Today's target · ${esc(fmt(new Date()))}</div><ul>${items}</ul></div>

      </div>
    </div>

}

      const mid=m.topics.map((_,ti)=>`${s.id}-${mi}-${ti}`),k=mid.filter(x=>done[x]).length,st=dueSt(due(s,m,mi),k===mid.length);

            ${t.also?`<div class="tags"><span class="pill">Also in Computer Network</span></div>`:""}
            <div class="vids">${s.channels.map((ch,k2)=>`<a class="v ${k2===0?"first":""}" href="${yt(ch,t.q)}" target="_blank" rel="noopener">${PLAY}${esc(CH[ch])}</a>`).join("")}</div>
            ${t.tip?`<div class="tip">${t.tip.startsWith("<b>")?t.tip:esc(t.tip)}</div>`:""}
          </div></li>`}).join("")}</ul></details>`}).join("")}
    </div></section>`;
}

function plan(i,theme){
  const k=todayKey();
  return `<section class="panel ${theme}" id="plan">${bar(i,"Day by day")}
    <div class="lead"><h2>18 Nov → 14 Dec</h2><p>Compiler Design comes first because its exam is the day after Honours. Honours and Computer Network share modules 1–3, so they're studied together on 22–24 Nov. In December each practical is prepared in the days just before it: Hacking, then ML, BI and NLP.</p></div>
    <ul class="plan">${PLAN.map(([d,items])=>`<li class="${d===k?"now":d<k?"past":""}"><span class="dd">${esc(fmt(d+"T12:00:00"+IST))}</span>
      <span>${items.map(([t,ex])=>ex?`<span class="ex">${esc(t)}</span>`:esc(t)).join(" · ")}</span></li>`).join("")}</ul></section>`;
}

function render(){
  const y=window.scrollY;
  const order=ORDERED();
  let html=hero()+overview(), i=3;
  order.forEach((s,k)=>{html+=subject(s,i++,k%2===0?"dark":"light")});
  html+=plan(i,"dark");
  html+=`<nav class="pager" id="pager" aria-label="Previous and next page"></nav>`;
  html+=`<p class="foot">Built from your Sem V scheme (batch 2024–28) and the Cyber Security Honours scheme. Video buttons open that channel's YouTube results for the topic. Practical dates and labs are from the ESEP timetable dated 18 Nov 2026 (TYCM3 · Sr. 37–71). Ticks are saved in this browser only.</p>`;
  document.getElementById("page").innerHTML=html;
  renderNav();
  bind();
  route(true);
  window.scrollTo(0,y);
}

const PAGES=["top","papers",...ORDERED().map(s=>s.id),"plan"];
const PAGENAMES={top:"Home",papers:"All papers",plan:"Day-by-day plan"};
function route(keepScroll){
  const h=location.hash.slice(1), cur=PAGES.includes(h)?h:"top";
  document.querySelectorAll(".panel").forEach(p=>{p.hidden=p.id!==cur});
  document.querySelectorAll("#navlinks a").forEach(a=>a.setAttribute("aria-current",a.dataset.nav===cur?"true":"false"));
  const ln=document.querySelector(`#navlinks a[data-nav="${cur}"]`);
  if(ln){const box=ln.parentElement; box.scrollLeft=ln.offsetLeft-box.clientWidth/2+ln.clientWidth/2}
  const i=PAGES.indexOf(cur), nm=id=>{const s=SUBJECTS.find(x=>x.id===id);return s?s.name:PAGENAMES[id]};
  const prev=PAGES[i-1], next=PAGES[i+1];
  document.getElementById("pager").innerHTML=
    (prev?`<a href="#${prev}"><span>← Previous</span><b>${esc(nm(prev))}</b></a>`:"")+
    (next?`<a class="nx${prev?"":" solo"}" href="#${next}"><span>Next →</span><b>${esc(nm(next))}</b></a>`:"");
  document.title=cur==="top"?"Sem V Exam Board":nm(cur)+" · Sem V Exam Board";
  if(!keepScroll) window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>route(false));

const NAVNAMES={scn:"Honours",cd:"Compiler",cn:"Network",ml:"ML",nlp:"NLP",eh:"Hacking",bi:"Power BI"};
function renderNav(){
  const k=todayKey();
  const items=[["top","Home"],["papers","All papers"],...ORDERED().map(s=>[s.id,NAVNAMES[s.id]]),["plan","Plan"]];
  document.getElementById("navlinks").innerHTML=items.map(([id,label])=>{
    const s=SUBJECTS.find(x=>x.id===id); let when="",soon=false;
    if(s){const d=sDate(s); if(d){const x=dayDiff(ymd(d),k); when=x<0?"✓":x===0?"today":x+"d"; soon=x>=0&&x<=4}else when="TBA"}
    return `<a class="ln${soon?" soon":""}" href="#${id}" data-nav="${id}">${s?'<span class="pip"></span>':""}${esc(label)}${when?`<span class="when">${when}</span>`:""}</a>`}).join("");
}

function bind(){
  document.querySelectorAll("input[data-id]").forEach(cb=>cb.addEventListener("change",()=>{
    const id=cb.dataset.id; if(cb.checked) done[id]=1; else delete done[id]; store.set("semv-done",done);
    cb.closest(".tp").classList.toggle("done",cb.checked);
    const [sid,mi]=id.split("-"); const s=SUBJECTS.find(x=>x.id===sid), m=s.modules[+mi];
    const mid=m.topics.map((_,ti)=>`${sid}-${mi}-${ti}`), k=mid.filter(x=>done[x]).length;
    document.querySelector(`[data-cnt="${sid}-${mi}"]`).textContent=`${k}/${mid.length}`;
    const st=dueSt(due(s,m,+mi),k===mid.length), el=document.querySelector(`[data-due="${sid}-${mi}"]`); el.className="pill "+st.cls; el.textContent=st.txt;
    const a=ids(s), n=a.filter(x=>done[x]).length;
    document.querySelector(`[data-meter="${sid}"]`).style.width=pct(s)+"%";
    document.querySelector(`[data-prog="${sid}"]`).textContent=`${n}/${a.length} topics`;
    const card=document.querySelector(`.card[href="#${sid}"]`);
    if(card){card.querySelector(".meter i").style.width=pct(s)+"%";card.querySelector(".pg .num").textContent=pct(s)+"%"}
  }));
}

render();
</script>
</body>
</html>
